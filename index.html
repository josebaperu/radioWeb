<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fef7ff" />
    <title>aautoradio</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('webradio.prefs') || 'null')
        var theme = saved && saved.theme
        var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#141218' : '#fef7ff')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // GitHub Pages publishes this repository as-is. Load the built bundle there.
      var pagesHost = /\.github\.io$/.test(location.hostname) || /[?&]built=1(?:&|$)/.test(location.search)
      if (pagesHost) {
        var icon = document.querySelector('link[rel="icon"]')
        if (icon) icon.setAttribute('href', './public/favicon.svg')
        var style = document.createElement('link')
        style.rel = 'stylesheet'
        style.href = './assets/index.css'
        document.head.appendChild(style)
        var app = document.createElement('script')
        app.type = 'module'
        app.src = './assets/app.js'
        document.body.appendChild(app)
      }
    </script>
  </body>
</html>
